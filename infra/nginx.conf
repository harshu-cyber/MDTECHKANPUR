# ==========================================
# MD TechKanpur — Production-Grade Nginx Configuration
# ==========================================
# This template configures Nginx with automatic HTTPS redirection, TLS 1.3 hardening, 
# HSTS headers, OCSP stapling, proxy forward headers, and concealed software signatures.

# 1. Automatic Port 80 HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name mdtechkanpur.com www.mdtechkanpur.com;

    # Redirect all HTTP requests to HTTPS with a permanent redirect (301)
    return 301 https://mdtechkanpur.com$request_uri;
}

# 2. Secure Port 443 HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mdtechkanpur.com www.mdtechkanpur.com;

    # SSL Certificate Paths (Managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/mdtechkanpur.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdtechkanpur.com/privkey.pem;

    # TLS Handshake Hardening (TLS 1.2 & TLS 1.3 only, SSLv3 / TLS 1.0 disabled)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # SSL Session Caching & Tuning (Optimizes performance while keeping secure)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m; # ~40,000 active sessions cached
    ssl_session_tickets off; # Prevents session ticket key leakage vulnerabilities

    # Diffie-Hellman Parameter for Perfect Forward Secrecy (PFS)
    # Generate this via command: openssl dhparam -out /etc/nginx/ssl/dhparam.pem 2048
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # OCSP Stapling (Speeds up TLS validation handshakes by caching certificate statuses)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ==========================================
    # Global Production Security Headers
    # ==========================================
    # HSTS (Strict Transport Security) - Force HTTPS for 2 years including subdomains
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Content-Security-Policy (CSP) - Controls load authority for script, style, and media
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.mdtechkanpur.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    
    # Clickjacking Protection (Disable iframe rendering of this site elsewhere)
    add_header X-Frame-Options "DENY" always;
    
    # MIME Sniffing Protection (Block browsers from executing non-script file downloads as scripts)
    add_header X-Content-Type-Options "nosniff" always;
    
    # Reflected XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Control
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Hardware/API Access Control (Disable hardware probes)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=()" always;

    # ==========================================
    # Information Exposure Restrictions
    # ==========================================
    # Prevent Nginx from showing its exact version number in standard HTTP headers/error logs
    server_tokens off;

    # ==========================================
    # Routing Rules
    # ==========================================
    # Root location: Static Frontend client distribution folder
    location / {
        root /var/www/mdtechkanpur/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html; # Enables SPA client-side routing fallback

        # Enable static file caching for high performance assets
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    # API Reverse Proxying to secure Node/Express Backend (Port 4000)
    location /api/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Forward real client IP headers (essential for Winston logs and express-rate-limiter)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
